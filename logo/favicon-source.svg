<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Social Media Globe — simplified favicon mark.
       Bold and minimal on purpose: fine detail (thin orbit lines,
       small satellite dot) disappears at 16px, so this keeps only
       what survives: a thick ring + one confident accent dot. -->
  <rect width="100" height="100" rx="20" fill="#0B1220"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#E8A33D" stroke-width="9"/>
  <line x1="20" y1="50" x2="80" y2="50" stroke="#E8A33D" stroke-width="7" stroke-linecap="round"/>
  <circle cx="74" cy="26" r="8" fill="#4FD1C5"/>
</svg>
