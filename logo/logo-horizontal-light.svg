<svg width="780" height="210" viewBox="0 0 520 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Social Media Globe — horizontal lockup, for light backgrounds
       (printed materials, invoices, light-themed social posts). -->

  <rect width="520" height="140" fill="#FFFFFF"/>

  <g transform="translate(14,14) scale(0.9)">
    <circle cx="60" cy="60" r="42" fill="none" stroke="#B9822F" stroke-width="4"/>
    <ellipse cx="60" cy="60" rx="42" ry="15" fill="none" stroke="#B9822F" stroke-width="2.5" opacity="0.9"/>
    <ellipse cx="60" cy="60" rx="15" ry="42" fill="none" stroke="#2F8B82" stroke-width="2.5" opacity="0.9" transform="rotate(28 60 60)"/>
    <circle cx="60" cy="18" r="3" fill="#2F8B82"/>
    <circle cx="102" cy="60" r="3" fill="#B9822F"/>
    <circle cx="24" cy="80" r="3" fill="#2F8B82"/>
    <circle cx="35" cy="30" r="3" fill="#B9822F"/>
    <circle cx="100" cy="20" r="7" fill="none" stroke="#B9822F" stroke-width="1.5" opacity="0.35"/>
    <circle cx="100" cy="20" r="4.5" fill="#B9822F"/>
  </g>

  <text x="158" y="66" font-family="Arial, Helvetica, sans-serif" font-weight="600"
        font-size="23" letter-spacing="4" fill="#12203A">SOCIAL MEDIA</text>
  <text x="158" y="107" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="42" letter-spacing="1" fill="#B9822F">GLOBE</text>
</svg>
