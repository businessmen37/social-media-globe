<svg width="820" height="312" viewBox="0 0 820 312" xmlns="http://www.w3.org/2000/svg">
  <!-- Social Media Globe — Facebook cover photo -->

  <rect width="820" height="312" fill="#0B1220"/>

  <!-- faint decorative orbit texture, kept toward the upper-right so it
       never competes with the logo lockup or the profile-picture overlap
       zone at bottom-left -->
  <g opacity="0.12" stroke="#E8A33D" fill="none">
    <ellipse cx="660" cy="90" rx="150" ry="52"/>
    <ellipse cx="660" cy="90" rx="52" ry="150" transform="rotate(25 660 90)"/>
  </g>
  <g opacity="0.10" stroke="#4FD1C5" fill="none">
    <circle cx="660" cy="90" r="150"/>
  </g>

  <!-- icon -->
  <g transform="translate(112,156) scale(0.85) translate(-60,-60)">
    <circle cx="60" cy="60" r="42" fill="none" stroke="#E8A33D" stroke-width="4"/>
    <ellipse cx="60" cy="60" rx="42" ry="15" fill="none" stroke="#E8A33D" stroke-width="2.5" opacity="0.9"/>
    <ellipse cx="60" cy="60" rx="15" ry="42" fill="none" stroke="#4FD1C5" stroke-width="2.5" opacity="0.9" transform="rotate(28 60 60)"/>
    <circle cx="60" cy="18" r="3" fill="#4FD1C5"/>
    <circle cx="102" cy="60" r="3" fill="#E8A33D"/>
    <circle cx="24" cy="80" r="3" fill="#4FD1C5"/>
    <circle cx="35" cy="30" r="3" fill="#E8A33D"/>
    <circle cx="100" cy="20" r="7" fill="none" stroke="#E8A33D" stroke-width="1.5" opacity="0.35"/>
    <circle cx="100" cy="20" r="4.5" fill="#E8A33D"/>
  </g>

  <!-- wordmark -->
  <text x="205" y="140" font-family="Arial, Helvetica, sans-serif" font-weight="600"
        font-size="30" letter-spacing="5" fill="#F1EFEA">SOCIAL MEDIA</text>
  <text x="205" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="54" letter-spacing="1" fill="#E8A33D">GLOBE</text>

  <!-- tagline -->
  <text x="207" y="228" font-family="Arial, Helvetica, sans-serif" font-weight="400"
        font-size="18" letter-spacing="0.5" fill="#8B96A8">Real growth. Real people. Worldwide.</text>
</svg>
