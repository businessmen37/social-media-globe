<svg width="2560" height="1440" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg">
  <!-- Social Media Globe — YouTube channel banner.
       YouTube crops this canvas differently per device; only content
       inside the centered ~1546x423 "safe area" is guaranteed visible
       everywhere, so the logo lockup sits there. Decorative orbit
       texture is allowed to fill the rest of the canvas. -->

  <rect width="2560" height="1440" fill="#0B1220"/>

  <!-- decorative orbit texture across the full canvas -->
  <g opacity="0.10" stroke="#E8A33D" fill="none">
    <ellipse cx="2100" cy="330" rx="420" ry="150"/>
    <ellipse cx="2100" cy="330" rx="150" ry="420" transform="rotate(25 2100 330)"/>
    <circle cx="2100" cy="330" r="420"/>
  </g>
  <g opacity="0.08" stroke="#4FD1C5" fill="none">
    <ellipse cx="420" cy="1150" rx="360" ry="130"/>
    <ellipse cx="420" cy="1150" rx="130" ry="360" transform="rotate(-20 420 1150)"/>
  </g>

  <!-- guide: safe-area box is 507,508 to 2053,931 (not drawn, kept for reference) -->

  <!-- icon -->
  <g transform="translate(1080,700) scale(2.7) translate(-60,-60)">
    <circle cx="60" cy="60" r="42" fill="none" stroke="#E8A33D" stroke-width="4"/>
    <ellipse cx="60" cy="60" rx="42" ry="15" fill="none" stroke="#E8A33D" stroke-width="2.5" opacity="0.9"/>
    <ellipse cx="60" cy="60" rx="15" ry="42" fill="none" stroke="#4FD1C5" stroke-width="2.5" opacity="0.9" transform="rotate(28 60 60)"/>
    <circle cx="60" cy="18" r="3" fill="#4FD1C5"/>
    <circle cx="102" cy="60" r="3" fill="#E8A33D"/>
    <circle cx="24" cy="80" r="3" fill="#4FD1C5"/>
    <circle cx="35" cy="30" r="3" fill="#E8A33D"/>
    <circle cx="100" cy="20" r="7" fill="none" stroke="#E8A33D" stroke-width="1.5" opacity="0.35"/>
    <circle cx="100" cy="20" r="4.5" fill="#E8A33D"/>
  </g>

  <!-- wordmark -->
  <text x="1290" y="660" font-family="Arial, Helvetica, sans-serif" font-weight="600"
        font-size="62" letter-spacing="9" fill="#F1EFEA">SOCIAL MEDIA</text>
  <text x="1290" y="778" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="112" letter-spacing="2" fill="#E8A33D">GLOBE</text>

  <!-- tagline -->
  <text x="1292" y="828" font-family="Arial, Helvetica, sans-serif" font-weight="400"
        font-size="34" letter-spacing="0.5" fill="#8B96A8">Real growth. Real people. Worldwide.</text>
</svg>
